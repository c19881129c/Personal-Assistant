name: Build Work Secretary APK

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: '版本號 (可輸入小數點，例如 1.0 或 1.1)'
        required: true
        default: '1.1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Cloud Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: 1. 檢出程式碼
        uses: actions/checkout@v5

      - name: 2. 安裝 Java Zulu JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. 安裝 Flutter 3.22.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: 4. 自動生成 Android 底層專案結構與 SDK 規格設定
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib_bak
          flutter create --platforms=android --org com.secretary.app --project-name work_secretary .
          mv pubspec.yaml.bak pubspec.yaml
          rm -rf lib && mv lib_bak lib
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/g' android/app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' android/app/build.gradle
          sed -i 's/jvmTarget = JavaVersion.VERSION_17/jvmTarget = "17"/g' android/app/build.gradle
          sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" android/app/build.gradle
          sed -i 's/android:label="work_secretary"/android:label="工作小秘書"/g' android/app/src/main/AndroidManifest.xml
          
          # 👇 新增這段：自動將 Kotlin 版本衝突的解法寫入 build.gradle 底部
          cat <<EOF >> android/app/build.gradle
          
          dependencies {
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
                      because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
                  }
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
                      because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
                  }
              }
          }
          EOF

      - name: 5. 下載套件並打包 Release APK
        run: |
          flutter pub get
          flutter build apk --release --build-name=${{ github.event.inputs.app_version }} --build-number=${{ github.run_number }}

      - name: 6. 上傳 APK 供下載
        uses: actions/upload-artifact@v4
        with:
          name: WorkSecretary-APK-v${{ github.event.inputs.app_version }}-build${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
