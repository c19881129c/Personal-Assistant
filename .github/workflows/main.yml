name: Build Work Secretary APK

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: '版本號 (例如 1.3)'
        required: true
        default: '1.3'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Cloud Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: 1. 檢出程式碼
        uses: actions/checkout@v5

      - name: 2. 安裝 Java Zulu JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. 安裝 Flutter 3.22.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: 4. 自動生成 Android 專案結構與固定簽章設定
        run: |
          if [ ! -f "release.jks" ]; then
            keytool -genkeypair -v -keystore release.jks -alias secretary_key -keyalg RSA -keysize 2048 -validity 10000 -storepass secretary123 -keypass secretary123 -dname "CN=WorkSecretary, OU=App, O=Personal, L=Taipei, S=Taiwan, C=TW"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add release.jks
            git commit -m "chore: save permanent android signing keystore"
            git push
          fi

          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib_bak
          flutter create --platforms=android --org com.secretary.app --project-name work_secretary .
          mv pubspec.yaml.bak pubspec.yaml
          rm -rf lib && mv lib_bak lib
          cp release.jks android/app/release.jks

          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/g' android/app/build.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' android/app/build.gradle
          sed -i 's/jvmTarget = JavaVersion.VERSION_17/jvmTarget = "17"/g' android/app/build.gradle
          sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" android/app/build.gradle
          sed -i '/buildTypes {/i signingConfigs { release { storeFile file("release.jks"); storePassword "secretary123"; keyPassword "secretary123"; keyAlias "secretary_key" } }' android/app/build.gradle
          sed -i 's/signingConfigs.debug/signingConfigs.release/g' android/app/build.gradle
          sed -i 's/android:label="work_secretary"/android:label="工作小秘書"/g' android/app/src/main/AndroidManifest.xml
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: 5. 下載套件並打包 Release APK
        run: |
          flutter pub get
          flutter build apk --release --build-name=${{ github.event.inputs.app_version }} --build-number=${{ github.run_number }}

      - name: 6. 上傳 APK 供下載
        uses: actions/upload-artifact@v4
        with:
          name: WorkSecretary-APK-v${{ github.event.inputs.app_version }}-build${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
